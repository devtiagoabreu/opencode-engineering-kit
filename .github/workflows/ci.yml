name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Markdown
        uses: avto-dev/markdown-lint@v1
        with:
          args: "*.md"
          config: ".markdownlint.json"
      
      - name: Check Shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts ./core ./tests .'
          check_templates: true
          severity: warning
      
      - name: Check YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: '.'
          config_file: '.yamllint.yml'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run all tests
        run: ./scripts/test.sh
      
      - name: Run CLI tests
        run: cd cli && npm test
      
      - name: Run type checks
        run: ./scripts/typecheck.sh

      - name: Run quality gates
        run: ./core/quality/validate.sh

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validation deps
        run: python -m pip install --upgrade pip pyyaml jsonschema

      - name: Validate asset schemas and manifest
        run: python scripts/validate_assets.py --root . --check-manifest

      - name: Check file sizes
        run: |
          echo "Checking file sizes..."
          find assets/skills -name "SKILL.md" | while read file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 600 ]; then
              echo "ERROR: $file exceeds 600 lines ($lines)"
              exit 1
            fi
          done
          if [ -d assets/vault ]; then
            find assets/vault -name "content.md" | while read file; do
              lines=$(wc -l < "$file")
              if [ "$lines" -gt 2000 ]; then
                echo "ERROR: $file exceeds 2000 lines ($lines)"
                exit 1
              fi
            done
          fi
          echo "All files within size limits"

      - name: Validate metadata JSON
        run: |
          echo "Validating metadata..."
          find assets -name "metadata.json" | while read file; do
            python3 -m json.tool "$file" > /dev/null
          done
          echo "All metadata files are valid"